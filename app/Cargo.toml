[package]
name = "openlang"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["apple", "coreaudio", "cpal", "openai", "whisper"]
openai = ["dep:openlang-provider-openai"]
whisper = ["dep:openlang-provider-whisper"]
apple = ["dep:openlang-provider-apple"]
coreaudio = ["dep:openlang-audio-coreaudio"]
cpal = ["dep:openlang-audio-cpal"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openlang-core.workspace = true
openlang-audio-dsp.workspace = true
openlang-audio-cpal = { workspace = true, optional = true }
openlang-provider-openai = { workspace = true, optional = true }
openlang-provider-whisper = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
openlang-provider-apple = { workspace = true, optional = true }
openlang-audio-coreaudio = { workspace = true, optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSResponder"] }
