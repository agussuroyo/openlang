name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A build that silently fell back to the slow scalar translation kernel fails instead.
  FXTRANSLATE_REQUIRE_SIMD: "1"
  # Panics keep file and line; full debug info only made compiling, linking and the cache slower.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Checks and bundles run side by side on every system, each with its own cache, so a run takes
# as long as the slower of the two instead of both.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include: &systems
          # Apple's speech and translation tests need a person's Mac: they wait on system
          # downloads and dialogs.
          - os: macos-26
            test: --exclude openlang-provider-apple
          - os: macos-26-intel
            test: --exclude openlang-provider-apple
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2025
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make check
      - run: make test ARGS="${{ matrix.test }}"

  bundle:
    strategy:
      fail-fast: false
      matrix:
        include: *systems
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLang-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
