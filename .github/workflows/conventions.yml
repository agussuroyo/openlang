name: Conventions

# Its own workflow, so editing a pull request title reruns only this check, not the builds.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Title and branch come through the environment, never pasted into the script.
      - run: make conventions BASE="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
