<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenLang Settings</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main id="main">
  <p id="loading" class="hint">Loading installed languages and engines.</p>
  <p id="problem" class="problem" role="alert" hidden></p>
  <section id="tab-language" role="tabpanel" aria-label="Language" hidden></section>
  <section id="tab-audio" role="tabpanel" aria-label="Audio" hidden></section>
  <section id="tab-engine" role="tabpanel" aria-label="Engine" hidden></section>
  <section id="tab-display" role="tabpanel" aria-label="Display" hidden></section>
</main>
<nav class="bar" id="bar" role="tablist" aria-label="Settings">
  <span class="hl" id="hl"></span>
  <button class="it" role="tab" data-tab="language" aria-label="Language"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h9M7.500 3.500V6M10.500 6c-.8 4-3.300 7-7 9M5 9c1.200 2.700 3.200 4.600 6 5.800M12.500 20.500l4-10 4 10M14 17h5"/></svg><span class="nm">Language</span></button>
  <button class="it" role="tab" data-tab="audio" aria-label="Audio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10.500v3"/></svg><span class="nm">Audio</span></button>
  <button class="it" role="tab" data-tab="engine" aria-label="Engine"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></svg><span class="nm">Engine</span></button>
  <button class="it" role="tab" data-tab="display" aria-label="Display"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 10 5l6 14M6.200 14h7.600M16 19l3-7 3 7M17 17h4"/></svg><span class="nm">Display</span></button>
</nav>
<script type="module" src="settings.js"></script>
</body>
</html>
