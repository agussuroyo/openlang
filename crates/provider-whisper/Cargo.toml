[package]
name = "openlang-provider-whisper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openlang-core.workspace = true
openlang-models.workspace = true
openlang-speech-chunks.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

# The graphics card through Vulkan. Without a usable one, whisper.cpp runs on the CPU.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }

[dev-dependencies]
openlang-contract.workspace = true
openlang-provider-bergamot.workspace = true
